<!DOCTYPE html>
<html>
<head>
    <title>Admin - Cadastro de Médicos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2 class="mb-4">Painel do Admin - Cadastro de Médico</h2>
    <div class="mb-3">
        <input id="nome-medico" class="form-control mb-2" placeholder="Nome do Médico">
        <input id="especialidade" class="form-control mb-2" placeholder="Especialidade">
        <input id="data-atendimento" class="form-control mb-2" placeholder="Data (YYYY-MM-DD)">
        <button class="btn btn-primary" onclick="cadastrarMedico()">Cadastrar Médico</button>
    </div>
    <div id="mensagem" class="mt-2 text-success"></div>

    <script>
        async function cadastrarMedico() {
            const data = {
                nome: document.getElementById('nome-medico').value,
                especialidade: document.getElementById('especialidade').value,
                data: document.getElementById('data-atendimento').value
            };
            await fetch('/api/cadastrar-medico/', {
                method: 'POST',
                body: JSON.stringify(data)
            });
            document.getElementById('mensagem').innerText = "Médico cadastrado com sucesso!";
        }
    </script>
</body>
</html>
